[package]
name = "selvedge-macos-screen"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
selvedge-rules = { path = "../rules" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"
