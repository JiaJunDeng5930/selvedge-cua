[package]
name = "selvedge-script-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
rmcp = { version = "3.10", features = ["transport-io"] }
rquickjs = { version = "0.14", features = ["futures", "parallel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
