[package]
name = "selvedge-macos-input"
version = "0.1.0"
edition = "2024"
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGEvent", "CGEventTypes", "CGRemoteOperation", "libc"] }
