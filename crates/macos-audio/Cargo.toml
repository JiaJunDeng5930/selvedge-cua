[package]
name = "selvedge-macos-audio"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
selvedge-rules = { path = "../rules" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
bytemuck = "1"
serde_json = "1"
whisper-rs = "0.16"

[build-dependencies]
cc = "1"
