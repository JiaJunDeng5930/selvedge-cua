[package]
name = "selvedge-cua-mcp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
selvedge-rules = { path = "crates/rules" }
selvedge-macos-audio = { path = "crates/macos-audio" }
selvedge-macos-ax = { path = "crates/macos-ax" }
selvedge-macos-desktop = { path = "crates/macos-desktop" }
selvedge-macos-input = { path = "crates/macos-input" }
selvedge-macos-screen = { path = "crates/macos-screen" }
selvedge-script-server = { path = "crates/script-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"

[profile.dev]
debug = 0

[workspace]
members = ["crates/*"]
resolver = "3"
